services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central_local
      POSTGRES_DB: central_financeira
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_financeira"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
